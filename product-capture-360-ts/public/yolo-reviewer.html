<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Annotation Reviewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #2a2a2a;
            padding: 15px 20px;
            border-bottom: 2px solid #3a3a3a;
        }

        .header h1 {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-weight: bold;
            color: #4CAF50;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: #2a2a2a;
            border-right: 2px solid #3a3a3a;
            overflow-y: auto;
            padding: 20px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        .filter-btn:hover {
            background: #4a4a4a;
        }

        .filter-btn.active:hover {
            background: #45a049;
        }

        .image-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .image-item {
            padding: 10px;
            background: #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .image-item:hover {
            background: #4a4a4a;
        }

        .image-item.selected {
            background: #4CAF50;
            color: white;
        }

        .image-item.annotated::before {
            content: '✓';
            color: #4CAF50;
            font-weight: bold;
            font-size: 16px;
        }

        .image-item.selected.annotated::before {
            color: white;
        }

        .image-item.not-annotated::before {
            content: '○';
            color: #999;
            font-size: 16px;
        }

        .image-name {
            flex: 1;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
        }

        .toolbar {
            background: #2a2a2a;
            padding: 15px 20px;
            border-bottom: 2px solid #3a3a3a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .image-info {
            font-size: 14px;
        }

        .image-info .filename {
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .image-info .status {
            font-size: 12px;
            color: #999;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            padding: 8px 16px;
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #4a4a4a;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            position: relative;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: crisp-edges;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading-spinner {
            border: 4px solid #3a3a3a;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls {
            background: #2a2a2a;
            padding: 15px 20px;
            border-top: 2px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shortcuts {
            font-size: 12px;
            color: #999;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #45a049;
        }

        .action-btn.secondary {
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
        }

        .action-btn.secondary:hover {
            background: #4a4a4a;
        }

        .annotation-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #4CAF50;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .missing-badge {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👁️ YOLO Annotation Reviewer</h1>
            <div class="stats">
                <div class="stat">
                    <span>Total:</span>
                    <span class="stat-value" id="total-images">0</span>
                </div>
                <div class="stat">
                    <span>Annotated:</span>
                    <span class="stat-value" id="annotated-count">0</span>
                    <span>(<span id="annotated-percent">0</span>%)</span>
                </div>
                <div class="stat">
                    <span>Missing:</span>
                    <span class="stat-value" style="color: #f44336;" id="missing-count">0</span>
                    <span>(<span id="missing-percent">0</span>%)</span>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="sidebar">
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterImages('all')">All</button>
                    <button class="filter-btn" onclick="filterImages('annotated')">Annotated</button>
                    <button class="filter-btn" onclick="filterImages('missing')">Missing</button>
                </div>
                <div class="image-list" id="image-list">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        Loading images...
                    </div>
                </div>
            </div>

            <div class="viewer">
                <div class="toolbar">
                    <div class="image-info">
                        <div class="filename" id="current-filename">No image selected</div>
                        <div class="status" id="current-status"></div>
                    </div>
                    <div class="nav-buttons">
                        <button class="nav-btn" onclick="previousImage()">← Previous</button>
                        <button class="nav-btn" onclick="nextImage()">Next →</button>
                    </div>
                </div>

                <div class="canvas-container">
                    <canvas id="canvas"></canvas>
                </div>

                <div class="controls">
                    <div class="shortcuts">
                        Shortcuts: ← → Navigate | A Annotated only | M Missing only | Esc Reset filter
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn secondary" onclick="openAnnotator()">
                            🏷️ Open in Annotator
                        </button>
                        <button class="action-btn" onclick="downloadReport()">
                            📊 Download Report
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/yolo-reviewer.js"></script>
</body>
</html>
