<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Annotation Reviewer - Product Capture 360</title>
    <link rel="stylesheet" href="/styles/design-system.css">
    <link rel="stylesheet" href="/styles/components.css">
    <style>
        /* YOLO Reviewer Specific Styles */
        body {
            overflow: hidden;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .reviewer-main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        /* Stats Header */
        .stats-header {
            background: var(--bg-secondary);
            padding: var(--space-4) var(--space-6);
            border-bottom: 1px solid var(--border-default);
            box-shadow: var(--shadow-md);
        }

        .stats-grid {
            display: flex;
            gap: var(--space-8);
            margin-top: var(--space-3);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-sm);
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            font-weight: var(--font-bold);
            color: var(--success);
            font-size: var(--text-lg);
        }

        .stat-value.danger {
            color: var(--danger);
        }

        .stat-percent {
            color: var(--text-tertiary);
            font-size: var(--text-sm);
        }

        /* Sidebar */
        .reviewer-sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-default);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-content {
            padding: var(--space-5);
            overflow-y: auto;
            flex: 1;
        }

        .filter-buttons {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-5);
        }

        .filter-btn {
            flex: 1;
            padding: var(--space-2) var(--space-3);
            background: var(--bg-tertiary);
            border: 2px solid var(--border-default);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: var(--text-sm);
        font-weight: var(--font-medium);
            transition: all var(--duration-fast) var(--ease-out);
        }

        .filter-btn:hover {
            background: var(--border-strong);
        }

        .filter-btn.active {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .filter-btn.active:hover {
            background: var(--success-hover);
        }

        /* Image List */
        .image-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .image-item {
            padding: var(--space-3);
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--space-3);
            transition: all var(--duration-fast) var(--ease-out);
            border: 2px solid transparent;
        }

        .image-item:hover {
            background: var(--border-strong);
            transform: translateX(4px);
        }

        .image-item.selected {
            background: var(--success);
            border-color: var(--success);
            color: white;
            transform: translateX(4px);
        }

        .image-item-icon {
            font-size: var(--text-lg);
            width: 20px;
            text-align: center;
        }

        .image-item.annotated .image-item-icon::before {
            content: '✓';
            color: var(--success);
            font-weight: var(--font-bold);
        }

        .image-item.selected.annotated .image-item-icon::before {
            color: white;
        }

        .image-item.not-annotated .image-item-icon::before {
            content: '○';
            color: var(--text-tertiary);
        }

        .image-name {
            flex: 1;
            font-size: var(--text-sm);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Viewer */
        .reviewer-viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .viewer-toolbar {
            background: var(--bg-secondary);
            padding: var(--space-4) var(--space-5);
            border-bottom: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .image-info-current {
            font-size: var(--text-sm);
        }

        .filename-display {
            font-weight: var(--font-semibold);
            color: var(--success);
            margin-bottom: var(--space-1);
            font-size: var(--text-base);
        }

        .status-display {
            font-size: var(--text-xs);
            color: var(--text-tertiary);
        }

        .nav-buttons-group {
            display: flex;
            gap: var(--space-2);
        }

        /* Canvas */
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            position: relative;
            background: var(--bg-app);
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: crisp-edges;
            box-shadow: var(--shadow-xl);
        }

        /* Controls Footer */
        .viewer-controls {
            background: var(--bg-secondary);
            padding: var(--space-4) var(--space-5);
            border-top: 1px solid var(--border-default);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shortcuts-info {
            font-size: var(--text-xs);
            color: var(--text-tertiary);
        }

        .shortcuts-info kbd {
            display: inline-block;
            padding: var(--space-1) var(--space-2);
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-default);
            font-family: var(--font-mono);
            font-size: var(--text-xs);
            margin: 0 var(--space-1);
        }

        .action-buttons-group {
            display: flex;
            gap: var(--space-2);
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: var(--space-16);
            color: var(--text-tertiary);
        }

        .annotation-badge {
            display: inline-flex;
            align-items: center;
            padding: var(--space-1) var(--space-2);
            background: var(--success);
            color: white;
            border-radius: var(--radius-sm);
            font-size: var(--text-xs);
            font-weight: var(--font-semibold);
        }

        .missing-badge {
            background: var(--danger);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .reviewer-sidebar {
                width: 250px;
            }

            .stats-grid {
                flex-direction: column;
                gap: var(--space-3);
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Navigation Header -->
        <div data-navigation></div>

        <!-- Stats Header -->
        <div class="stats-header">
            <h2 style="font-size: var(--text-2xl); margin-bottom: var(--space-2);">👁️ YOLO Annotation Reviewer</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Total:</span>
                    <span class="stat-value" id="total-images">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Annotated:</span>
                    <span class="stat-value" id="annotated-count">0</span>
                    <span class="stat-percent">(<span id="annotated-percent">0</span>%)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Missing:</span>
                    <span class="stat-value danger" id="missing-count">0</span>
                    <span class="stat-percent">(<span id="missing-percent">0</span>%)</span>
                </div>
            </div>
        </div>

        <div class="reviewer-main">
            <!-- Sidebar -->
            <div class="reviewer-sidebar">
                <div class="sidebar-content">
                    <div class="filter-buttons">
                        <button class="filter-btn active" onclick="filterImages('all')">All</button>
                        <button class="filter-btn" onclick="filterImages('annotated')">✓</button>
                        <button class="filter-btn" onclick="filterImages('missing')">○</button>
                    </div>
                    <div class="image-list" id="image-list">
                        <div class="loading-state">
                            <div class="loading-spinner"></div>
                            <p>Loading images...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Viewer -->
            <div class="reviewer-viewer">
                <div class="viewer-toolbar">
                    <div class="image-info-current">
                        <div class="filename-display" id="current-filename">No image selected</div>
                        <div class="status-display" id="current-status"></div>
                    </div>
                    <div class="nav-buttons-group">
                        <button class="btn btn-secondary btn-sm" onclick="previousImage()">
                            ← Previous
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="nextImage()">
                            Next →
                        </button>
                    </div>
                </div>

                <div class="canvas-container">
                    <canvas id="canvas"></canvas>
                </div>

                <div class="viewer-controls">
                    <div class="shortcuts-info">
                        <kbd>←</kbd><kbd>→</kbd> Navigate |
                        <kbd>A</kbd> Annotated only |
                        <kbd>M</kbd> Missing only |
                        <kbd>Esc</kbd> Reset filter
                    </div>
                    <div class="action-buttons-group">
                        <button class="btn btn-secondary" onclick="openAnnotator()">
                            🏷️ Open in Annotator
                        </button>
                        <button class="btn btn-primary" onclick="downloadReport()">
                            📊 Download Report
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/logger.js"></script>
    <script src="/components/navigation.js"></script>
    <script>
        // Initialize navigation
        ProductCapture360.Navigation.init({
            title: 'YOLO Annotation Reviewer',
            subtitle: 'Review and validate YOLO detection results',
            activePage: 'annotator'
        });
    </script>
    <script src="/yolo-reviewer.js"></script>
</body>
</html>
