[project]
name = "product-capture-360"
version = "1.0.0"
description = "Professional 360° product image capture system for AI model training"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Team", email = "team@example.com"}
]
keywords = ["computer-vision", "product-photography", "yolo", "object-detection", "360-capture"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "streamlit>=1.31.0",
    "opencv-python>=4.9.0.80",
    "numpy>=1.26.4",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
]

# Enhanced features
enhanced = [
    "rembg>=2.0.50",           # Background removal
    "torch>=2.0.0",             # For advanced models
    "ultralytics>=8.1.0",       # YOLOv11 integration
]

# Cloud storage
cloud = [
    "boto3>=1.34.0",            # AWS S3
    "google-cloud-storage>=2.14.0",  # Google Cloud
    "azure-storage-blob>=12.19.0",   # Azure
]

# Complete installation with all features
all = [
    "rembg>=2.0.50",
    "torch>=2.0.0",
    "ultralytics>=8.1.0",
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
    "azure-storage-blob>=12.19.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/product-capture-360"
Documentation = "https://github.com/yourorg/product-capture-360/wiki"
Repository = "https://github.com/yourorg/product-capture-360"
Issues = "https://github.com/yourorg/product-capture-360/issues"

[project.scripts]
product-capture = "app:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# UV-specific configuration
dev-dependencies = [
    "black>=24.0.0",
    "ruff>=0.2.0",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"