<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd89b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#19547b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#backgroundGradient)" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="white">File Browser</text>
  
  <!-- Folder Icon -->
  <g transform="translate(150, 80)">
    <path d="M10 20 L90 20 L90 80 L10 80 Z" fill="url(#folderGradient)" stroke="#333" stroke-width="2" rx="5"/>
    <path d="M10 20 L30 20 L35 10 L50 10 L55 20 L90 20" fill="url(#folderGradient)" stroke="#333" stroke-width="2"/>
    
    <!-- Files inside folder -->
    <rect x="20" y="35" width="60" height="8" fill="white" opacity="0.8" rx="2"/>
    <rect x="20" y="48" width="45" height="8" fill="white" opacity="0.6" rx="2"/>
    <rect x="20" y="61" width="55" height="8" fill="white" opacity="0.7" rx="2"/>
  </g>
  
  <!-- Preview Window -->
  <rect x="50" y="180" width="300" height="80" fill="white" stroke="#333" stroke-width="2" rx="5"/>
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Live Preview Window</text>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Real-time file content display</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Supports images, text, data, and code files</text>
  
  <!-- Navigation arrows -->
  <g transform="translate(20, 120)">
    <circle cx="15" cy="15" r="12" fill="white" opacity="0.9"/>
    <path d="M10 15 L20 10 L20 20 Z" fill="#333"/>
  </g>
  
  <g transform="translate(350, 120)">
    <circle cx="15" cy="15" r="12" fill="white" opacity="0.9"/>
    <path d="M20 15 L10 10 L10 20 Z" fill="#333"/>
  </g>
  
  <!-- Feature indicators -->
  <circle cx="80" cy="270" r="5" fill="#4CAF50"/>
  <text x="95" y="275" font-family="Arial, sans-serif" font-size="10" fill="white">Navigation</text>
  
  <circle cx="180" cy="270" r="5" fill="#2196F3"/>
  <text x="195" y="275" font-family="Arial, sans-serif" font-size="10" fill="white">Live Preview</text>
  
  <circle cx="280" cy="270" r="5" fill="#FF9800"/>
  <text x="295" y="275" font-family="Arial, sans-serif" font-size="10" fill="white">File Operations</text>
</svg>